<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6c3cff">
  <title>RATATAA • Secret Message</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#ffe7a8 0 12%,transparent 30%),radial-gradient(circle at 90% 90%,#d9c7ff 0 10%,transparent 28%),linear-gradient(135deg,#fff7e8,#efe7ff);display:grid;place-items:center;padding:18px;color:#17132b;overflow-x:hidden}.wrap{width:min(560px,100%)}.card{position:relative;background:#fff;border:4px solid #17132b;border-radius:30px;box-shadow:0 14px 0 #17132b,0 24px 45px #39246b22;padding:28px 22px 24px;text-align:center;overflow:hidden}.doodle{position:absolute;font-size:28px;animation:float 3s ease-in-out infinite}.d1{left:12px;top:12px}.d2{right:14px;top:50px;animation-delay:.8s}.d3{left:18px;bottom:18px;animation-delay:1.4s}.d4{right:20px;bottom:18px;animation-delay:2s}.rat{width:132px;height:132px;margin:0 auto 12px;border-radius:50%;background:#b9bcc8;border:5px solid #17132b;position:relative;display:grid;place-items:center;box-shadow:inset 0 -10px 0 #9699a8}.ear{position:absolute;width:42px;height:42px;border-radius:50%;background:#d9a7b6;border:5px solid #17132b;top:-13px}.ear.l{left:5px}.ear.r{right:5px}.face{font-size:62px;line-height:1;filter:drop-shadow(0 2px 0 #17132b)}h1{font-size:clamp(28px,7vw,42px);margin:6px 0 4px;letter-spacing:-1.5px}h2{font-size:clamp(18px,4.8vw,24px);margin:0 0 18px;color:#6c3cff}.bubble{background:#f3efff;border:3px solid #17132b;border-radius:20px;padding:16px;margin:0 auto 18px;max-width:430px;font-size:17px;line-height:1.45}.lock{font-size:48px;margin:5px 0}.price{font-size:15px;color:#625c73;margin:8px 0 18px}.pay{appearance:none;border:0;border-bottom:5px solid #311b8d;background:#6c3cff;color:white;font-size:18px;font-weight:800;border-radius:16px;padding:15px 24px;width:100%;cursor:pointer;transition:.15s transform,.15s filter}.pay:hover{filter:brightness(1.06)}.pay:active{transform:translateY(3px);border-bottom-width:2px}.note{font-size:12px;color:#777;margin-top:14px}.reveal{display:none;margin-top:18px;background:#fff0f0;border:3px dashed #ff4f64;border-radius:18px;padding:18px}.reveal strong{display:block;font-size:30px;margin-top:6px}.status{min-height:20px;font-size:13px;margin-top:10px;color:#6b6478}@keyframes float{50%{transform:translateY(-7px) rotate(4deg)}}@media(max-width:420px){.card{padding:22px 16px 20px;border-radius:24px}.rat{width:112px;height:112px}.face{font-size:52px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="RATATAA secret message">
      <span class="doodle d1">⭐</span><span class="doodle d2">💥</span><span class="doodle d3">😂</span><span class="doodle d4">📩</span>
      <div class="rat" aria-hidden="true"><i class="ear l"></i><i class="ear r"></i><div class="face">🐀</div></div>
      <h1>RATATAA</h1>
      <h2>has sent you a text message!</h2>
      <div class="bubble">📩 You have received a <b>SECRET MESSAGE</b>.<br>But RATATAA locked it 🔐</div>
      <div class="lock">🔒</div>
      <div class="price">Unlock the secret message for <b>₹7</b></div>
      <button class="pay" id="payBtn">💳 Unlock for ₹7</button>
      <div class="status" id="status" role="status"></div>
      <div class="reveal" id="reveal">🎉 PAYMENT VERIFIED!<strong>R u a Gay? 😂</strong></div>
      <div class="note">Secure payment • Message unlocks only after successful verification</div>
    </section>
  </main>
  <script>
    const API='https://prankpage-kappa.vercel.app';
    const btn=document.getElementById('payBtn');
    const status=document.getElementById('status');
    const reveal=document.getElementById('reveal');
    const params=new URLSearchParams(location.search);
    const token=params.get('token');
    if(params.get('paid')==='1'&&token){
      fetch(API+'/api/reveal?token='+encodeURIComponent(token)).then(r=>r.json()).then(d=>{
        if(d.ok){reveal.style.display='block';btn.style.display='none';document.querySelector('.lock').textContent='🔓';status.textContent='Payment verified successfully!';history.replaceState({},'',location.pathname);}
      }).catch(()=>{});
    }
    btn.addEventListener('click',async()=>{
      btn.disabled=true; btn.textContent='⏳ Opening secure checkout…'; status.textContent='';
      try{
        const r=await fetch(API+'/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
        const data=await r.json();
        if(!r.ok||!data.ok) throw new Error(data.message||'Payment service is not configured yet.');
        const form=document.createElement('form');form.method='POST';form.action=data.paymentUrl;form.style.display='none';
        Object.entries(data.formData).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)});
        document.body.appendChild(form);form.submit();
      }catch(e){status.textContent=e.message;btn.disabled=false;btn.textContent='💳 Unlock for ₹7';}
    });
  </script>
</body>
</html>
